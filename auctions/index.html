:root { --u: 19.2px; --bg: #EEF2F8; --navy: #14284B; --ink: #2E2E2E; --slate: #5E5E5E; --line: #E1E3E5; --t1: #4F86C6; --t3: #2F5A8F; --t4: #86AEDC; --t6: #A6A6A6; --red: #D64545; --amber: #D98B1F; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --bg: #EEF2F8; } } :root[data-theme="dark"] { --bg: #EEF2F8; }
html, body { margin: 0; height: 100%; background: var(--bg); overflow: hidden; }
* { box-sizing: border-box; }
.wrap { width: calc(100 * var(--u)); margin: 0 auto; position: relative; top: 50%; transform: translateY(-50%); }
.s2 { direction: rtl; font-family: 'Segoe UI', 'Segoe UI Arabic', Tahoma, 'Noto Sans Arabic', 'BussmaAr', Arial, sans-serif; color: var(--ink); }
.cv { position: relative; width: 100%; height: calc(56.25 * var(--u)); overflow: hidden; background: radial-gradient(120% 90% at 100% 0%, #E3EBF6 0%, #F4F7FB 45%, #EEF2F8 100%); display: grid; grid-template-rows: calc(7.2 * var(--u)) calc(7.4 * var(--u)) 1fr; grid-row-gap: calc(1.1 * var(--u)); padding: calc(1.3 * var(--u)) 0 calc(1.2 * var(--u)); }
.hd { display: flex; align-items: center; justify-content: space-between; margin: 0 calc(2.4 * var(--u)); padding: 0 calc(2.4 * var(--u)); background: linear-gradient(100deg, #0E1E3A 0%, #14284B 45%, #2F5A8F 100%); color: #fff; border-radius: calc(.8 * var(--u)); box-shadow: 0 calc(.4 * var(--u)) calc(1.2 * var(--u)) rgba(20,40,75,.25); }
.band { display: flex; align-items: center; }
.band::before { content: ''; width: calc(.45 * var(--u)); height: calc(3.4 * var(--u)); background: var(--t1); margin-left: calc(1.2 * var(--u)); }
.ttl { margin: 0 0 0 calc(1.2 * var(--u)); font-size: calc(2.9 * var(--u)); font-weight: 700; line-height: 1; }
.upd { font-size: calc(1.2 * var(--u)); color: rgba(255,255,255,.78); white-space: nowrap; align-self: flex-end; padding-bottom: calc(.2 * var(--u)); }
.logo { height: calc(5.6 * var(--u)); width: auto; }
.kp { display: grid; grid-template-columns: 1.35fr repeat(4, 1fr); grid-column-gap: calc(.9 * var(--u)); padding: 0 calc(2.4 * var(--u)); }
.k { background: #fff; border-top: calc(.45 * var(--u)) solid var(--k, var(--slate)); border-radius: calc(.6 * var(--u)); box-shadow: 0 calc(.25 * var(--u)) calc(.9 * var(--u)) rgba(20,40,75,.10); display: flex; flex-direction: column; align-items: center; justify-content: center; min-width: 0; }
.kn { font-size: calc(3.2 * var(--u)); font-weight: 700; line-height: 1; color: var(--navy); }
.kl { font-size: calc(1.05 * var(--u)); color: var(--slate); white-space: nowrap; margin-top: calc(.3 * var(--u)); }
.k.main { background: linear-gradient(135deg, #14284B 0%, #2F5A8F 100%); border-top-color: var(--t4); }
.k.main .kn, .k.main .kl { color: #fff; } .k.main .kn { font-size: calc(3.8 * var(--u)); }
.bd { display: grid; grid-template-columns: calc(30 * var(--u)) 1fr; grid-column-gap: calc(1.4 * var(--u)); padding: 0 calc(2.4 * var(--u)); min-height: 0; }
.box { background: #fff; border-radius: calc(.8 * var(--u)); box-shadow: 0 calc(.3 * var(--u)) calc(1.1 * var(--u)) rgba(20,40,75,.10); overflow: hidden; padding: calc(1.1 * var(--u)) calc(1.2 * var(--u)); min-height: 0; display: flex; flex-direction: column; }
.tag { font-size: calc(1.6 * var(--u)); font-weight: 700; color: var(--navy); padding-bottom: calc(.6 * var(--u)); margin-bottom: calc(.9 * var(--u)); border-bottom: calc(.15 * var(--u)) solid var(--line); display: flex; align-items: center; white-space: nowrap; }
.tag::before { content: ''; width: calc(.9 * var(--u)); height: calc(.9 * var(--u)); border-radius: 50%; background: var(--t1); box-shadow: 0 0 0 calc(.3 * var(--u)) rgba(79,134,198,.25); margin-left: calc(.7 * var(--u)); }
#next { background: linear-gradient(160deg, #14284B 0%, #1C3A66 60%, #2F5A8F 130%); color: #fff; }
#next .tag { color: #fff; border-bottom-color: rgba(255,255,255,.18); }
.nx { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; }
.nx-d { font-size: calc(8.5 * var(--u)); font-weight: 700; line-height: 1; }
.nx-u { font-size: calc(1.8 * var(--u)); color: rgba(255,255,255,.85); margin-top: calc(.4 * var(--u)); }
.nx-n { font-size: calc(2.1 * var(--u)); font-weight: 700; margin-top: calc(1.4 * var(--u)); }
.nx-m { font-size: calc(1.3 * var(--u)); color: rgba(255,255,255,.8); margin-top: calc(.6 * var(--u)); }
.nx-dt { display: flex; margin-top: calc(1.2 * var(--u)); }
.nx-dt div { background: rgba(255,255,255,.1); border-radius: calc(.5 * var(--u)); padding: calc(.6 * var(--u)) calc(1.2 * var(--u)); margin: 0 calc(.4 * var(--u)); }
