:root { --u: 19.2px; --bg: #EEF2F8; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --bg: #EEF2F8; } }
:root[data-theme="dark"] { --bg: #EEF2F8; }
html, body { margin: 0; height: 100%; background: var(--bg); overflow: hidden; }
.wrap { width: calc(100 * var(--u)); margin: 0 auto; position: relative; top: 50%; transform: translateY(-50%); }
.s2 { direction: rtl; font-family: 'BussmaAr', 'Segoe UI', 'Segoe UI Arabic', Tahoma, Arial, sans-serif; color: #2E2E2E; }
.cv { position: relative; width: 100%; height: calc(56.25 * var(--u)); overflow: hidden; box-sizing: border-box;
  background: radial-gradient(120% 90% at 100% 0%, #E3EBF6 0%, #F4F7FB 45%, #EEF2F8 100%);
  display: grid; grid-template-rows: calc(7.2 * var(--u)) 1fr; grid-row-gap: calc(1.1 * var(--u)); row-gap: calc(1.1 * var(--u));
  padding: calc(1.3 * var(--u)) 0 calc(1.2 * var(--u)); }
.head { display: flex; align-items: center; justify-content: space-between; margin: 0 calc(2.4 * var(--u)); padding: 0 calc(2.4 * var(--u));
  background: linear-gradient(100deg, #0E1E3A 0%, #14284B 45%, #2F5A8F 100%); color: #fff; border-radius: calc(.8 * var(--u));
  box-shadow: 0 calc(.4 * var(--u)) calc(1.2 * var(--u)) rgba(20,40,75,.25); position: relative; overflow: hidden; }
.head::after { content: ''; position: absolute; left: calc(22 * var(--u)); top: calc(-6 * var(--u)); width: calc(18 * var(--u)); height: calc(18 * var(--u)); border-radius: 50%;
  background: radial-gradient(circle, rgba(134,174,220,.22), rgba(134,174,220,0) 70%); }
.band { display: flex; align-items: center; }
.band::before { content: ''; width: calc(.45 * var(--u)); height: calc(3.4 * var(--u)); background: #4F86C6; margin-left: calc(1.2 * var(--u)); }
.title { margin: 0; font-size: calc(2.9 * var(--u)); font-weight: 700; line-height: 1; }
.upd { font-size: calc(.85 * var(--u)); color: rgba(255,255,255,.7); margin-top: calc(.5 * var(--u)); }
.note { font-size: calc(1.05 * var(--u)); color: #fff; background: rgba(255,255,255,.12); border: calc(.08 * var(--u)) solid rgba(255,255,255,.25); border-radius: calc(.5 * var(--u)); padding: calc(.5 * var(--u)) calc(1 * var(--u)); position: relative; z-index: 1; margin-right: auto; margin-left: calc(2 * var(--u)); }
.logo { height: calc(5.6 * var(--u)); width: auto; position: relative; z-index: 1; }
.side { display: flex; flex-direction: column; min-height: 0; }
.kpis { flex: 0 0 calc(8.4 * var(--u)); display: flex; margin-bottom: calc(1.1 * var(--u)); }
.kpis .kpi { flex: 1 1 0; }
.kpis .kpi + .kpi { margin-right: calc(.9 * var(--u)); }
#top { flex: 1 1 auto; }
.kpi { background: #fff; border-top: calc(.45 * var(--u)) solid var(--k, #5E5E5E); border-radius: calc(.6 * var(--u)); box-shadow: 0 calc(.25 * var(--u)) calc(.9 * var(--u)) rgba(20,40,75,.10);
  display: flex; flex-direction: column; align-items: center; justify-content: center; min-width: 0; }
.kpi-n { font-size: calc(3.2 * var(--u)); font-weight: 700; line-height: 1; color: #14284B; }
.kpi-l { font-size: calc(1.05 * var(--u)); color: #5E5E5E; white-space: nowrap; margin-top: calc(.3 * var(--u)); }
.kpi-l b { color: #2F5A8F; font-weight: 700; margin-right: calc(.3 * var(--u)); }
.kpi.main { background: linear-gradient(135deg, #14284B 0%, #2F5A8F 100%); border-top-color: #86AEDC; box-shadow: 0 calc(.4 * var(--u)) calc(1.2 * var(--u)) rgba(20,40,75,.3); }
.kpi.main .kpi-n, .kpi.main .kpi-l { color: #fff; }
.kpi.main .kpi-n { font-size: calc(3.8 * var(--u)); }
.kpi.now .kpi-l b { color: #4F86C6; }
.body { display: grid; grid-template-columns: calc(36 * var(--u)) 1fr; grid-column-gap: calc(1.4 * var(--u)); column-gap: calc(1.4 * var(--u)); padding: 0 calc(2.4 * var(--u)); min-height: 0; position: relative; }
.box { position: relative; background: #fff; border-radius: calc(.8 * var(--u)); box-shadow: 0 calc(.3 * var(--u)) calc(1.1 * var(--u)) rgba(20,40,75,.10); overflow: hidden;
  padding: calc(1.1 * var(--u)) calc(1.2 * var(--u)); min-height: 0; display: flex; flex-direction: column; box-sizing: border-box; }
.tag { font-size: calc(1.6 * var(--u)); font-weight: 700; color: #14284B; padding-bottom: calc(.6 * var(--u)); margin-bottom: calc(.9 * var(--u)); border-bottom: calc(.15 * var(--u)) solid #E1E3E5; white-space: nowrap; display: flex; align-items: center; }
.tag::before { content: ''; width: calc(.9 * var(--u)); height: calc(.9 * var(--u)); border-radius: 50%; background: #4F86C6; box-shadow: 0 0 0 calc(.3 * var(--u)) rgba(79,134,198,.25); margin-left: calc(.7 * var(--u)); }
.tag small { font-size: calc(.7 * var(--u)); font-weight: 400; color: #6E6E6E; margin-right: auto; }
#top { background: linear-gradient(160deg, #14284B 0%, #1C3A66 60%, #2F5A8F 130%); box-shadow: 0 calc(.4 * var(--u)) calc(1.4 * var(--u)) rgba(20,40,75,.3); }

#top .tag small { color: rgba(255,255,255,.65); }
.chart { position: relative; flex: 1 1 auto; min-height: 0; }

.list { flex: 1 1 auto; min-height: 0; display: grid; grid-template-rows: 1.35fr 1fr 1fr 1fr 1fr; grid-row-gap: calc(.8 * var(--u)); row-gap: calc(.8 * var(--u)); position: relative; z-index: 1; }
.row { background: #fff; border-radius: calc(.6 * var(--u)); border-right: calc(.45 * var(--u)) solid #4F86C6; box-shadow: 0 calc(.3 * var(--u)) calc(.9 * var(--u)) rgba(0,0,0,.18);

.ct b { display: block; font-size: calc(2.4 * var(--u)); line-height: 1; color: #14284B; }
.ct span { font-size: calc(.85 * var(--u)); color: #6E6E6E; }

.row.first .nm { font-size: calc(1.8 * var(--u)); }
.row.first .ct b { font-size: calc(3.2 * var(--u)); color: #A67608; }

        return;
      }
      if (!future) svg.append('rect').attr('x', bx).attr('y', base - h).attr('width', x.bandwidth()).attr('height', h).attr('rx', u * 0.25).attr('fill', col);
      svg.append('text').attr('x', bx + x.bandwidth() / 2).attr('y', base - h - u * 0.5).attr('text-anchor', 'middle').attr('direction', 'ltr')
        .attr('fill', future ? '#A6A6A6' : '#14284B').style('font-size', u * 1.25 + 'px').style('font-weight', '700').text(future ? '—' : fmt(m.listings));
      if (now) svg.append('text').attr('x', bx + x.bandwidth() / 2).attr('y', base - h - u * 1.9).attr('text-anchor', 'middle').attr('fill', '#4F86C6').style('font-size', u * 0.8 + 'px').text('حتى الآن');
      svg.append('text').attr('x', bx + x.bandwidth() / 2).attr('y', base + u * 1.5).attr('text-anchor', 'middle').attr('fill', future ? '#A6A6A6' : '#2E2E2E')
        .style('font-size', u * 0.95 + 'px').style('font-weight', now ? '700' : '400').text(m.name);
    });
  }

  function run() { unit(); kpis(); list(); chart(); }
  unit(); kpis(); list();
  window.addEventListener('load', run);
  var t; window.addEventListener('resize', function () { clearTimeout(t); t = setTimeout(run, 150); });
  setTimeout(function () { location.reload(); }, 15 * 60 * 1000);
})();
</script>
</body></html>
